<div class="modal-overlay">
  <div class="modal-box">
    <h5>{{ title }}</h5>
    <p>{{ message }}</p>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button class="btn btn-danger" (click)="onConfirm()">Yes</button>
    </div>
  </div>
</div>
