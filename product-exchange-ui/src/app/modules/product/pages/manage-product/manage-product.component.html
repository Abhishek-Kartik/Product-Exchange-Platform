<div class="p-2">
  <h2>Manage my Products</h2>
  <hr>
  <div class="alert alert-danger mt-2" role="alert" *ngIf="errorMsg.length">
    <p class="p-0 m-0" *ngFor="let msg of errorMsg">{{msg}}</p>
  </div>
  <div class="d-flex gap-2">
    <div class="col-3">
      <img class="rounded-1" width="100%" height="100%" [src]=" selectedPicture || 'https://picsum.photos/seed/product/1900/800'" alt="">
      <div class="mt-2">
        <input
          (change)="onFileSelected($event)"
          class="form-control"
          type="file"
          id="formFile"
          accept="image/*"
        >
      </div>
    </div>
    <div class="col-9">
      <form class="row g-3">
        <div class="col-12">
          <label for="title" class="form-label">Title</label>
          <input [(ngModel)]="productRequest.title" type="text" class="form-control" id="title" name="title"
                 placeholder="Product title">
        </div>
        <div class="col-md-6">
          <label for="author" class="form-label">Brand</label>
          <input [(ngModel)]="productRequest.brand" type="email" class="form-control" id="brand" name="brand"
                 placeholder="Brand">
        </div>
        <div class="col-md-6">
          <label for="isbn" class="form-label">Product Code</label>
          <input [(ngModel)]="productRequest.productCode" type="text" class="form-control" id="productCode" name="productCode">
        </div>
        <div class="col-12">
          <label for="synopsis" class="form-label">Description</label>
          <textarea [(ngModel)]="productRequest.description" rows="4" class="form-control" id="description" name="description"
                    placeholder="Description about the product"></textarea>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input [(ngModel)]="productRequest.shareable" class="form-check-input" type="checkbox" id="gridCheck"
                   name="shareable">
            <label class="form-check-label" for="gridCheck">
              Share me
            </label>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 col-12">
          <button (click)="saveProduct()" type="submit" class="btn btn-outline-primary">
            <i class="fas fa-save"></i>&nbsp;Save
          </button>
          <a routerLink="/products/my-products" type="submit" class="btn btn-link btn text-danger">
            <i class="fas fa-times"></i>&nbsp;Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
