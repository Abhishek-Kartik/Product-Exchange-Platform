<app-confirmation-modal
  *ngIf="showArchiveModal"
  [title]="'Archive Product'"
  [message]="'Are you sure you want to archive this product?'"
  (confirm)="confirmArchive()"
  (cancel)="closeModal()"
>
</app-confirmation-modal>
<h2>My Product list</h2>
<hr>
<div class="d-flex justify-content-end mb-3">
  <a routerLink="/products/manage" class="btn btn-outline-primary">
    <i class="fas fa-plus"></i>&nbsp;New Product
  </a>
</div>
<div class="d-flex justify-content-start gap-4 flex-wrap">
  <app-product-card
    *ngFor="let product of productResponse.content"
    [product]="product"
    [manage]="true"
    (archive)="archiveProduct($event)"
    (share)="shareProduct($event)"
    (edit)="editProduct($event)"
    (delete)="deleteProduct($event)"
  ></app-product-card>
</div>
<div class="d-flex justify-content-center mt-3">
  <nav aria-label="Page navigation example">
    <ul class="pagination">
      <li class="page-item">
        <a
          (click)="goToFirstPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.disabled]="page === 0"
        >
          <i class="fa-solid fa-angles-left"></i>
        </a>
      </li>
      <li class="page-item">
        <a
          (click)="goToPreviousPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Previous"
          [class.disabled]="page === 0"
        >
          <i class="fa-solid fa-angle-left"></i>
        </a>
      </li>
      <li
        class="page-item"
        *ngFor="let pageIndex of pages"
      >
        <a
          (click)="gotToPage(pageIndex)"
          class="page-link"
          [class.active]="page === pageIndex"
          href="javascript:void(0)"
        >{{ pageIndex + 1 }}</a>
      </li>
      <li class="page-item">
        <a
          (click)="goToNextPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Next"
          [class.disabled]="isLastPage"
        >
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </li>
      <li class="page-item">
        <a
          (click)="goToLastPage()"
          class="page-link"
          href="javascript:void(0)"
          aria-label="Next"
          [class.disabled]="isLastPage"
        >
          <i class="fa-solid fa-angles-right"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>
