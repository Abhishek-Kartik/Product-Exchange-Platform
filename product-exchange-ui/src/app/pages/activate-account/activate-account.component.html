<div class="container" *ngIf="submitted; else codeForm">
  <div class="activation-message" *ngIf="isOkay; else activationError">
    <h2>Activation Successful!</h2>
    <p>Your account has been successfully activated.</p>
    <button class="btn btn-primary" (click)="redirectToLogin()">
      Go to Login
    </button>
  </div>
  <ng-template #activationError>
    <div class="activation-error">
      <h2>Activation Failed!</h2>
      <p>{{ message }}</p>
      <button class="btn btn-primary" (click)="submitted = false">
        Try again
      </button>
    </div>
  </ng-template>
</div>

<ng-template #codeForm>
  <div class="container">
    <div class="text-center" style="width: 500px">
      <h2>Enter your activation code</h2>
      <code-input
        [isCodeHidden]="false"
        [codeLength]="6"
        [code]="'number'"
        (codeCompleted)="onCodeCompleted($event)"
      ></code-input>
      <br />
      <div class="mt-4">
        <p>Didn't receive the code?</p>
        <button
          type="button"
          class="btn btn-primary"
          (click)="resendCode(this.email)"
          [disabled]="resendCooldown > 0">

          <span *ngIf="resendCooldown <= 0"> Resend Activation Code </span>
          <span *ngIf="resendCooldown > 0"> Resend Activation Code in {{ resendCooldown }}s </span>

        </button>
      </div>
    </div>
  </div>
</ng-template>
